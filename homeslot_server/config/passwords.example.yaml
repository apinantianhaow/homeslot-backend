# Copy to `config/passwords.yaml` (never commit that file) and replace every
# value with a long random string, e.g. `openssl rand -base64 32`.
# In Docker, pass them as SERVERPOD_PASSWORD_<name> environment variables.

development:
  database: 'change-me'
  serviceSecret: 'change-me'
  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'

test:
  database: 'change-me'
  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'

production:
  database: 'change-me'
  serviceSecret: 'change-me'
  emailSecretHashPepper: 'change-me'
  jwtHmacSha512PrivateKey: 'change-me'
  jwtRefreshTokenHashPepper: 'change-me'

# Optional, any run mode (use `shared:` to apply to all):
#
# SMTP for verification and password reset codes. Without it the codes are
# printed in the server log.
#   smtpHost: 'smtp.gmail.com'
#   smtpPort: '587'
#   smtpUsername: 'homeslot@example.com'
#   smtpPassword: 'app-password'
#   smtpFrom: 'homeslot@example.com'
#
# Google sign-in: the JSON of the OAuth client (Web application) from the
# Google Cloud console.
#   googleClientSecret: '{"web":{"client_id":"...","client_secret":"...","redirect_uris":["..."]}}'
#
# Push notifications: the Firebase service account key JSON. Alternatively
# place it at config/firebase_service_account_key.json.
#   firebaseServiceAccount: '{"type":"service_account","project_id":"...", ...}'
